<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <title>ZERACK Chat</title>
  <link rel="stylesheet" href="chat.css"/>
</head>
<body data-ready="0">

<div id="app" class="app" hidden>
  <aside id="side" class="side" aria-label="Conversations">
    <div class="side-head">
      <button id="side-new" class="side-new" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>New chat</span>
      </button>
      <button id="side-close" class="icon only-narrow" type="button" title="Close the list" aria-label="Close the list">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button id="voice-conv" class="conv voice-conv" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="conv-title">Voice</span>
      <span id="voice-dot" class="live-dot" hidden></span>
    </button>
    <div id="conv-list" class="conv-list"></div>
    <div class="side-foot">History stays on this computer.</div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <header class="top">
      <button id="btn-list" class="icon only-narrow" type="button" title="Conversations" aria-label="Conversations">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <img class="mark" src="../icons/zerack-mark-small.svg" alt="" width="22" height="22"/>
        <span class="word">ZERACK</span>
      </div>
      <div class="title-wrap">
        <span id="conv-title" class="conv-name">New chat</span>
        <input id="title-edit" class="title-edit" type="text" maxlength="80" aria-label="Chat name" hidden/>
      </div>
      <button id="btn-new" class="icon" type="button" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-more" class="icon" type="button" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      </button>
      <button id="btn-close" class="icon only-overlay" type="button" title="Close the chat (Esc)" aria-label="Close the chat">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="more-menu" class="menu down" role="menu" hidden>
        <button class="menu-item" type="button" data-act="rename" role="menuitem">Rename this chat</button>
        <button class="menu-item" type="button" data-act="delete" role="menuitem">Delete this chat</button>
        <button class="menu-item" type="button" data-act="hide-site" role="menuitem">Hide the bubble on this site</button>
        <button class="menu-item" type="button" data-act="clear-voice" role="menuitem">Clear the voice history</button>
        <button class="menu-item danger" type="button" data-act="delete-all" role="menuitem">Delete all conversations</button>
        <div class="menu-sep"></div>
        <button class="menu-item" type="button" data-act="setup" role="menuitem">Keys and voice setup</button>
        <button class="menu-item" type="button" data-act="close" role="menuitem">Close the chat</button>
      </div>
    </header>

    <section id="thread" class="thread" aria-live="polite">
      <div id="empty" class="empty">
        <img class="empty-mark" src="../icons/zerack-mark.svg" alt="" width="132" height="132"/>
        <div class="empty-word">ZERACK</div>
        <p class="empty-line">Private assistant. Your keys, your machine.</p>
        <div class="chips">
          <button class="chip" type="button">Open YouTube</button>
          <button class="chip" type="button">What niche should I start this week?</button>
          <button class="chip" type="button">Read my saved niches and pick the best one</button>
          <button class="chip" type="button">How do I raise my click-through rate?</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
      <div id="voice-view" class="voice-view" hidden></div>
    </section>

    <footer class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask ZERACK or tell it what to do" aria-label="Message"></textarea>
        <div class="row">
          <button id="model-pill" class="pill" type="button" aria-haspopup="menu" aria-expanded="false" title="Model">
            <span id="model-label">Auto</span>
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="agent-pill" class="pill agent" type="button" role="switch" aria-checked="false" title="Let ZERACK act in the browser: open pages, search, save and export">
            <span class="pill-dot"></span><span id="agent-label">Agent off</span>
          </button>
          <span class="grow"></span>
          <button id="hf" class="hf" type="button" role="switch" aria-checked="false" title="Hands-free: ZERACK listens all the time">
            <span class="hf-track"><span class="hf-knob"></span></span><span class="hf-text">Hands-free</span>
          </button>
          <button id="mic" class="round mic" type="button" title="Hold to talk. Tap to start, tap again to send" aria-label="Talk">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          </button>
          <button id="send" class="round send" type="button" title="Send" aria-label="Send">
            <svg class="i-send" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
        <div id="model-menu" class="menu up" role="menu" hidden></div>
      </div>
      <div id="hint" class="hint">History stays on this computer. Each answer names the provider it went to.</div>
    </footer>
  </main>
</div>

<script src="../lib/nsp-models.js"></script>
<script src="../lib/nsp-chat-store.js"></script>
<script src="chat-render.js"></script>
<script src="chat.js"></script>
</body>
</html>
