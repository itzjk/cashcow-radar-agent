<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicheMaster · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">¿Vale la pena ese nicho? Pasamelo y te doy un <b>score de oportunidad</b>, RPM estimado, nivel de saturación, <b>sub-nichos</b> más jugosos, ideas de video listas, vías de monetización y qué tan <b>faceless</b> es.</p>

    <div class="tk-card">
      <h3>1 · Nicho a validar</h3>
      <div class="tk-row">
        <div class="tk-field grow">
          <label>Nicho / idea de canal</label>
          <input class="tk-in" id="niche" placeholder="Ej: historias de terror reales, datos del espacio, estoicismo…" />
        </div>
        <div class="tk-field">
          <label>Mercado</label>
          <select class="tk-in" id="lang">
            <option value="español (LatAm)">Español (LatAm)</option>
            <option value="español (España)">Español (España)</option>
            <option value="inglés (US)">Inglés (US)</option>
            <option value="portugués (BR)">Portugués (BR)</option>
            <option value="alemán">Alemán</option>
          </select>
        </div>
        <div class="tk-field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="tk-btn primary" id="go">📊 Validar nicho</button>
        </div>
      </div>
      <div class="tk-status" id="status"></div>
    </div>

    <div class="tk-result" id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="nichemaster.js"></script>
</body>
</html>
