<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicheMaster · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">Is that niche worth it? Give it a niche and it returns an <b>opportunity score</b>, an estimated RPM, the saturation level, the richest <b>sub-niches</b>, ready video ideas, monetization routes and how <b>faceless</b> it can be.</p>

    <div class="tk-card">
      <h3>1 · Niche to validate</h3>
      <div class="tk-row">
        <div class="tk-field grow">
          <label>Niche or channel idea</label>
          <input class="tk-in" id="niche" placeholder="Example: real horror stories, space facts, stoicism" />
        </div>
        <div class="tk-field">
          <label>Market</label>
          <select class="tk-in" id="lang">
            <option value="español (LatAm)">Spanish (LatAm)</option>
            <option value="español (España)">Spanish (Spain)</option>
            <option value="inglés (US)">English (US)</option>
            <option value="portugués (BR)">Portuguese (BR)</option>
            <option value="alemán">German</option>
          </select>
        </div>
        <div class="tk-field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="tk-btn primary" id="go">Validate niche</button>
        </div>
      </div>
      <div class="tk-status" id="status"></div>
    </div>

    <div class="tk-result" id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="nichemaster.js"></script>
</body>
</html>
