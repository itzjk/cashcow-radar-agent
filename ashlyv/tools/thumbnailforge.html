<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotionForge Studio · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">Paste your script and it builds the <b>visual plan</b>: one image or video prompt per scene, ready for Flow, Veo, Midjourney or Nano Banana, plus 3 high CTR <b>thumbnail concepts</b>. The style stays consistent across the whole video.</p>

    <div class="tk-card">
      <h3>1 · Script and style</h3>
      <textarea class="tk-in" id="script" rows="6" placeholder="Paste your script, or let ScriptPilot hand it over"></textarea>
      <div class="tk-row" style="margin-top:12px">
        <div class="tk-field">
          <label>Look</label>
          <select class="tk-in" id="look">
            <option value="cinematic photorealistic, dramatic lighting">Photoreal cinematic</option>
            <option value="dark moody, fog, low key, mystery">Dark and mysterious</option>
            <option value="warm cozy, fireplace, soft, dreamy (sleep stories)">Warm and cosy</option>
            <option value="epic historical, painterly, golden hour">Epic historical</option>
            <option value="hyperreal 3D render, octane, volumetric light">Hyperreal 3D</option>
            <option value="vintage documentary, film grain, archival">Vintage documentary</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Aspect ratio</label>
          <select class="tk-in" id="ar">
            <option value="16:9 horizontal">16:9 (YouTube)</option>
            <option value="9:16 vertical">9:16 (Shorts)</option>
            <option value="1:1 square">1:1</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Max scenes</label>
          <select class="tk-in" id="max">
            <option value="6">6</option>
            <option value="10" selected>10</option>
            <option value="16">16</option>
            <option value="24">24</option>
          </select>
        </div>
        <div class="tk-field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="tk-btn primary" id="go">Generate visual plan</button>
        </div>
      </div>
      <div class="tk-status" id="status"></div>
    </div>

    <div class="tk-result" id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="thumbnailforge.js"></script>
</body>
</html>
