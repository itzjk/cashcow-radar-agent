<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RivalRadar Pro · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">Antes de producir, mirá el campo de batalla. Pasame un nicho o keyword y te armo <b>búsquedas listas</b> (clic = abre YouTube), los <b>formatos replicables</b> que están funcionando, los <b>huecos</b> sin explotar y los <b>ángulos de monetización</b>.</p>

    <div class="tk-card">
      <h3>1 · Nicho / keyword</h3>
      <div class="tk-row">
        <div class="tk-field grow">
          <label>Nicho o tema</label>
          <input class="tk-in" id="kw" placeholder="Ej: misterios sin resolver, finanzas para jóvenes, mitología nórdica…" />
        </div>
        <div class="tk-field">
          <label>Idioma / mercado</label>
          <select class="tk-in" id="lang">
            <option value="español">Español</option>
            <option value="inglés (US)">Inglés (US)</option>
            <option value="portugués (BR)">Portugués (BR)</option>
            <option value="alemán">Alemán</option>
            <option value="francés">Francés</option>
          </select>
        </div>
        <div class="tk-field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="tk-btn primary" id="go">🛰️ Analizar competencia</button>
        </div>
      </div>
      <div class="tk-status" id="status"></div>
    </div>

    <div class="tk-result" id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="competitorfinder.js"></script>
</body>
</html>
