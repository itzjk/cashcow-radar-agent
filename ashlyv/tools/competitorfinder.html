<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RivalRadar Pro · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">Look at the field before you produce. Give it a niche or a keyword and it returns <b>ready-made searches</b> that open YouTube on click, the <b>repeatable formats</b> that are working, the <b>gaps</b> nobody is filling and the <b>monetization angles</b>.</p>

    <div class="tk-card">
      <h3>1 · Niche or keyword</h3>
      <div class="tk-row">
        <div class="tk-field grow">
          <label>Niche or topic</label>
          <input class="tk-in" id="kw" placeholder="Example: unsolved mysteries, personal finance, norse mythology" />
        </div>
        <div class="tk-field">
          <label>Language and market</label>
          <select class="tk-in" id="lang">
            <option value="español">Spanish</option>
            <option value="English (US)">English (US)</option>
            <option value="Portuguese (BR)">Portuguese (BR)</option>
            <option value="alemán">German</option>
            <option value="francés">French</option>
          </select>
        </div>
        <div class="tk-field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="tk-btn primary" id="go">Analyze the competition</button>
        </div>
      </div>
      <div class="tk-status" id="status"></div>
    </div>

    <div class="tk-result" id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="competitorfinder.js"></script>
</body>
</html>
