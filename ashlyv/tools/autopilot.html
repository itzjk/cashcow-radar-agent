<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoPilot · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">Un tema → <b>todo el paquete</b> en un clic: guion + escenas + metadata + prompts de imagen por escena + miniaturas. Después lo mandás a VoxBatch (voz) o directo a Monetize Studio para armar el video.</p>

    <div class="tk-card">
      <h3>1 · Solo dame el tema</h3>
      <div class="tk-row">
        <div class="tk-field grow">
          <label>Tema / idea</label>
          <input class="tk-in" id="topic" placeholder="Ej: la leyenda del barco fantasma que nadie pudo explicar" />
        </div>
        <div class="tk-field">
          <label>Nicho</label>
          <select class="tk-in" id="niche">
            <option value="historias para dormir">Historias para dormir</option>
            <option value="misterios / terror">Misterios / Terror</option>
            <option value="historia / documentales">Historia / Documental</option>
            <option value="motivación / estoicismo">Motivación</option>
            <option value="curiosidades / datos">Curiosidades</option>
            <option value="crimen real">Crimen real</option>
          </select>
        </div>
      </div>
      <div class="tk-row" style="margin-top:12px">
        <div class="tk-field">
          <label>Duración</label>
          <select class="tk-in" id="mins">
            <option value="1">1 min</option><option value="3">3 min</option>
            <option value="6" selected>6 min</option><option value="10">10 min</option><option value="20">20 min</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Idioma</label>
          <select class="tk-in" id="lang">
            <option value="español">Español</option><option value="inglés">Inglés</option>
            <option value="portugués">Portugués</option><option value="alemán">Alemán</option><option value="francés">Francés</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Estética visual</label>
          <select class="tk-in" id="look">
            <option value="cinematic photorealistic, dramatic lighting">Cinematográfico</option>
            <option value="dark moody, fog, mystery">Oscuro / misterio</option>
            <option value="warm cozy fireplace, dreamy (sleep)">Cálido / sleep</option>
            <option value="epic historical, painterly">Histórico épico</option>
          </select>
        </div>
        <div class="tk-field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="tk-btn primary" id="go">🚀 Generar TODO</button>
        </div>
      </div>
      <div class="tk-status" id="status"></div>
      <div id="steps" style="margin-top:12px"></div>
    </div>

    <div class="tk-result" id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="autopilot.js"></script>
</body>
</html>
