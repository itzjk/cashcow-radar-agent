<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoPilot · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">One topic, <b>the whole package</b> in one click: script, scenes, metadata, an image prompt per scene and thumbnails. Send it on to VoxBatch for voice, or straight to Monetize Studio to build the video.</p>

    <div class="tk-card">
      <h3>1 · Just give me the topic</h3>
      <div class="tk-row">
        <div class="tk-field grow">
          <label>Topic or idea</label>
          <input class="tk-in" id="topic" placeholder="Example: the legend of the ghost ship nobody could explain" />
        </div>
        <div class="tk-field">
          <label>Niche</label>
          <select class="tk-in" id="niche">
            <option value="historias para dormir">Sleep stories</option>
            <option value="misterios / terror">Mystery and horror</option>
            <option value="historia / documentales">History and documentary</option>
            <option value="motivación / estoicismo">Motivation</option>
            <option value="curiosidades / datos">Curious facts</option>
            <option value="crimen real">True crime</option>
          </select>
        </div>
      </div>
      <div class="tk-row" style="margin-top:12px">
        <div class="tk-field">
          <label>Length</label>
          <select class="tk-in" id="mins">
            <option value="1">1 min</option><option value="3">3 min</option>
            <option value="6" selected>6 min</option><option value="10">10 min</option><option value="20">20 min</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Language</label>
          <select class="tk-in" id="lang">
            <option value="español">Spanish</option><option value="inglés">English</option>
            <option value="portugués">Portuguese</option><option value="alemán">German</option><option value="francés">French</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Visual look</label>
          <select class="tk-in" id="look">
            <option value="cinematic photorealistic, dramatic lighting">Cinematic</option>
            <option value="dark moody, fog, mystery">Dark and mysterious</option>
            <option value="warm cozy fireplace, dreamy (sleep)">Warm and cosy</option>
            <option value="epic historical, painterly">Epic historical</option>
          </select>
        </div>
        <div class="tk-field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="tk-btn primary" id="go">Generate everything</button>
        </div>
      </div>
      <div class="tk-status" id="status"></div>
      <div id="steps" style="margin-top:12px"></div>
    </div>

    <div class="tk-result" id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="autopilot.js"></script>
</body>
</html>
