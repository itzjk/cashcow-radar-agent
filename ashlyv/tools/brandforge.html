<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrandForge · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">Identidad completa de tu canal faceless con IA: <b>nombres</b>, <b>handle</b>, <b>tagline</b>, <b>bio</b>, <b>paleta</b>, <b>pilares de contenido</b> y <b>logo + banner reales</b> (imágenes generadas gratis). Lo que HacksLabs cobra en su plan caro, acá gratis y más completo.</p>

    <div class="tk-card">
      <h3>1 · Tu canal</h3>
      <textarea class="tk-in" id="niche" rows="2" placeholder="Nicho / tema del canal… (ej: historias de misterio sin resolver · música para dormir · sabiduría estoica)"></textarea>
      <div class="tk-row" style="margin-top:12px">
        <div class="tk-field">
          <label>Estética</label>
          <select class="tk-in" id="style">
            <option value="dark moody mystery, fog, low key, cinematic, high contrast">Oscuro / misterio</option>
            <option value="warm cozy dreamy, soft glow, calm, pastel (sleep)">Cálido / sleep</option>
            <option value="epic historical, golden hour, painterly, dramatic">Histórico épico</option>
            <option value="minimal modern, clean, bold geometric, flat">Minimal moderno</option>
            <option value="luxury gold and black, premium, elegant, sleek">Lujo / premium</option>
            <option value="hyperreal 3D render, volumetric light, octane">3D hiperreal</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Idioma</label>
          <select class="tk-in" id="lang">
            <option value="español">Español</option>
            <option value="english">English</option>
            <option value="português">Português</option>
            <option value="deutsch">Deutsch</option>
          </select>
        </div>
      </div>
      <button class="tk-btn primary" id="go" style="margin-top:14px;width:100%">🎨 Generar identidad completa</button>
      <div id="status" style="margin-top:10px;font-size:12px;font-weight:700;"></div>
    </div>

    <div id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="brandforge.js"></script>
</body>
</html>
