<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrandForge · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">A full identity for your faceless channel, built with AI: <b>names</b>, <b>handle</b>, <b>tagline</b>, <b>bio</b>, <b>palette</b>, <b>content pillars</b> and a <b>real logo and banner</b> generated as images.</p>

    <div class="tk-card">
      <h3>1 · Your channel</h3>
      <textarea class="tk-in" id="niche" rows="2" placeholder="Channel niche or topic, for example unsolved mystery stories, sleep music, stoic wisdom"></textarea>
      <div class="tk-row" style="margin-top:12px">
        <div class="tk-field">
          <label>Look</label>
          <select class="tk-in" id="style">
            <option value="dark moody mystery, fog, low key, cinematic, high contrast">Dark and mysterious</option>
            <option value="warm cozy dreamy, soft glow, calm, pastel (sleep)">Warm and cosy</option>
            <option value="epic historical, golden hour, painterly, dramatic">Epic historical</option>
            <option value="minimal modern, clean, bold geometric, flat">Modern minimal</option>
            <option value="luxury gold and black, premium, elegant, sleek">Luxury and premium</option>
            <option value="hyperreal 3D render, volumetric light, octane">Hyperreal 3D</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Language</label>
          <select class="tk-in" id="lang">
            <option value="español">Spanish</option>
            <option value="english">English</option>
            <option value="português">Portuguese</option>
            <option value="deutsch">German</option>
          </select>
        </div>
      </div>
      <button class="tk-btn primary" id="go" style="margin-top:14px;width:100%">Generate the full identity</button>
      <div id="status" style="margin-top:10px;font-size:12px;font-weight:700;"></div>
    </div>

    <div id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="brandforge.js"></script>
</body>
</html>
