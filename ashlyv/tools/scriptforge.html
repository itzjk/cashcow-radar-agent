<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScriptPilot AI · ZERACK</title>
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <header class="tk-head" id="tk-head"></header>
  <div class="tk-wrap">
    <p class="tk-sub">Turns a topic into a <b>complete production package</b>: a continuous script, a scene by scene breakdown with narration and visual idea, plus title, description and tags ready to upload. Built for faceless channels.</p>

    <div class="tk-card">
      <h3>1 · Define the video</h3>
      <div class="tk-row">
        <div class="tk-field grow">
          <label>Topic or idea</label>
          <input class="tk-in" id="topic" placeholder="Example: the mystery of the lighthouse that vanished in 1921" />
        </div>
        <div class="tk-field">
          <label>Niche</label>
          <select class="tk-in" id="niche">
            <option value="sleep stories">Sleep stories</option>
            <option value="misterios / terror">Mystery and horror</option>
            <option value="historia / documentales">History and documentary</option>
            <option value="motivation and stoicism">Motivation and stoicism</option>
            <option value="curiosities / datos">Curious facts</option>
            <option value="crimen real">True crime</option>
            <option value="ciencia / espacio">Science and space</option>
            <option value="finanzas / negocios">Finance and business</option>
          </select>
        </div>
      </div>
      <div class="tk-row" style="margin-top:12px">
        <div class="tk-field">
          <label>Length (min)</label>
          <select class="tk-in" id="mins">
            <option value="1">1 min (Short)</option>
            <option value="3">3 min</option>
            <option value="6" selected>6 min</option>
            <option value="10">10 min</option>
            <option value="20">20 min</option>
            <option value="45">45 min (sleep)</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Language</label>
          <select class="tk-in" id="lang">
            <option value="español">Spanish</option>
            <option value="inglés">English</option>
            <option value="portugués">Portuguese</option>
            <option value="alemán">German</option>
            <option value="francés">French</option>
          </select>
        </div>
        <div class="tk-field">
          <label>Tone</label>
          <select class="tk-in" id="tone">
            <option value="cinematic and immersive">Cinematic</option>
            <option value="calm, slow, made for sleep">Calm (sleep)</option>
            <option value="intrigante y de suspenso">Suspense</option>
            <option value="energetic and direct">Energetic</option>
            <option value="documental serio">Documentary</option>
          </select>
        </div>
        <div class="tk-field" style="flex:0 0 auto">
          <label>&nbsp;</label>
          <button class="tk-btn primary" id="go">Generate script</button>
        </div>
      </div>
      <div class="tk-status" id="status"></div>
    </div>

    <div class="tk-result" id="result"></div>
  </div>
  <script src="toolkit.js"></script>
  <script src="scriptforge.js"></script>
</body>
</html>
