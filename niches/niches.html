<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ZERACK · Faceless Niche Finder</title>
  <link rel="stylesheet" href="niches.css"/>
</head>
<body>
<div class="header">
  <div class="header-left">
    <span class="logo"><svg viewBox="0 0 100 60" width="24" height="15" fill="#fff" style="vertical-align:middle;margin-right:4px;filter:drop-shadow(0 0 4px rgba(255,255,255,0.5))"><path d="M50 15 C45 5 30 2 18 8 C10 12 4 20 2 28 C8 24 16 22 22 26 C18 30 16 36 18 42 C22 36 28 32 34 33 C36 38 40 44 44 48 C46 44 48 38 50 35 C52 38 54 44 56 48 C60 44 64 38 66 33 C72 32 78 36 82 42 C84 36 82 30 78 26 C84 22 92 24 98 28 C96 20 90 12 82 8 C70 2 55 5 50 15 Z"/></svg> ZERACK</span>
    <div class="header-titles">
      <span class="title">Faceless Niche Finder</span>
      <span class="subtitle">Nichos AI virales para canales sin cara — actualizados automáticamente</span>
    </div>
  </div>
  <div class="header-right">
    <span id="disc-badge" class="disc-badge" style="display:none">🔭 <span id="disc-count">0</span> canales descubiertos</span>
    <a href="../dashboard/dashboard.html" class="header-btn">📺 Mis Canales</a>
  </div>
</div>

<div class="search-bar">
  <input id="search" class="search-input" placeholder="🔍 Buscar nicho..." type="text"/>
  <div class="filter-row">
    <button class="fpill active" data-rpm="ALL">Todos</button>
    <button class="fpill" data-rpm="high">💰 Alto RPM ($10+)</button>
    <button class="fpill" data-rpm="mid">📈 Medio RPM ($5-10)</button>
    <button class="fpill" data-rpm="low">🎮 Bajo RPM (&lt;$5)</button>
  </div>
</div>

<div id="grid" class="grid"></div>

<script src="niches.js"></script>
</body>
</html>
