<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ZERACK · Voice</title>
  <link rel="stylesheet" href="voice.css"/>
</head>
<body class="voice">

<header class="head">
  <div class="brand">ZERACK</div>
  <div class="sub">Voice</div>
  <div class="live" id="wake-badge" hidden><span class="dot"></span>Listening for "Zerack"</div>
</header>

<main class="stage">
  <button class="orb" id="orb" type="button" data-state="idle" aria-label="Push to talk" aria-pressed="false">
    <span class="ring"></span>
    <span class="ring ring-2"></span>
    <span class="arc"></span>
    <span class="core"></span>
  </button>
  <div class="state" id="state-label" aria-live="polite">Ready</div>
  <div class="hint" id="hint">Hold to talk, or hold Space. Esc stops.</div>

  <p class="notice" id="notice" hidden><span id="notice-text"></span> <code id="notice-cmd" hidden></code></p>

  <section class="exchange" id="exchange" hidden>
    <div class="who">You</div>
    <p class="said" id="you-text"></p>
    <div class="who">ZERACK</div>
    <p class="answer" id="bot-text"></p>
    <p class="meta" id="exchange-meta"></p>
  </section>
</main>

<footer class="controls">
  <div class="field">
    <label for="engine">Voice</label>
    <select id="engine">
      <option value="browser">Browser voice, free</option>
      <option value="fish">ZERACK voice, paid, uses your Fish Audio key</option>
      <option value="openai">OpenAI voice, paid, uses your OpenAI key</option>
      <option value="local" hidden disabled>Local voice server</option>
    </select>
  </div>
  <div class="field" id="sub-field" hidden>
    <label for="sub-voice" id="sub-label">Browser voice</label>
    <select id="sub-voice"></select>
  </div>
  <p class="engine-note" id="engine-note"></p>
  <label class="switch">
    <input type="checkbox" id="wake"/>
    <span class="track"></span>
    <span class="switch-text">Wake word "Zerack"</span>
  </label>
</footer>

<script type="module" src="../lib/whisper/whisper-local.js"></script>
<script src="voice.js"></script>
</body>
</html>
