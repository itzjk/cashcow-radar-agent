<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZERACK · Índice de Nichos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000; --panel: #0a0a0a; --line: rgba(255,255,255,.12);
    --txt: #fff; --mut: rgba(255,255,255,.55); --ok: #FFFFFF; --bad: #FF2D2D; --warn: #FFFFFF;
  }
  html, body { background: var(--bg); color: var(--txt); font-family: "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif; min-height: 100%; }
  body {
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  #app { max-width: 1280px; margin: 0 auto; padding: 22px 18px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 26px; filter: drop-shadow(0 0 10px rgba(255,255,255,.5)); }
  h1 { font-size: 17px; font-weight: 800; letter-spacing: .12em; font-family: "Bahnschrift SemiBold", "Aptos Display", "Segoe UI Semibold", "Segoe UI", "Helvetica Neue", Arial, sans-serif; text-shadow: 0 0 10px rgba(255,255,255,.45); }
  .sub { font-size: 10.5px; color: var(--mut); margin-top: 3px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 9px; padding: 9px 14px; font: 800 11px "Bahnschrift SemiBold", "Segoe UI Semibold", "Segoe UI", "Helvetica Neue", Arial, sans-serif; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.12); }
  button.danger { border-color: rgba(255, 45, 45,.5); color: var(--bad); }
  #stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .v { font-size: 20px; font-weight: 900; color: var(--ok); text-shadow: 0 0 12px rgba(255, 255, 255,.4); }
  .stat .k { font-size: 9.5px; color: var(--mut); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
  #searchRow { display: flex; gap: 10px; margin-bottom: 12px; }
  #search { flex: 1; background: #0d0d0d; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; color: #fff; padding: 11px 14px; font: 13px "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif; outline: none; }
  #search:focus { border-color: rgba(255,255,255,.55); }
  #tableWrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; padding: 11px 12px; font-size: 10px; font-family: "Bahnschrift SemiBold", "Segoe UI Semibold", "Segoe UI", Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; background: #0a0a0a; }
  th:hover { color: #fff; }
  th .arrow { color: var(--ok); margin-left: 4px; }
  td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: top; }
  tr:hover td { background: rgba(255,255,255,.03); }
  .niche { font-weight: 900; color: #fff; }
  .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .vph { color: var(--ok); font-weight: 800; }
  .up { color: var(--ok); font-weight: 900; }
  .down { color: var(--bad); font-weight: 900; }
  .flat { color: var(--mut); font-weight: 900; }
  .best { color: rgba(255,255,255,.8); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .chs { color: var(--mut); font-size: 10px; }
  .empty { padding: 46px 20px; text-align: center; color: var(--mut); line-height: 1.7; font-size: 12.5px; }
  .empty b { color: var(--ok); }
  #foot { margin-top: 12px; font-size: 10px; color: var(--mut); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">🛡️</div>
      <div>
        <h1>ZERACK · ÍNDICE DE NICHOS</h1>
        <div class="sub">Base propia acumulativa — cada SCAN alimenta el índice automáticamente. Sin servidores, sin APIs.</div>
      </div>
    </div>
    <div class="actions">
      <button id="btnExport">⬇ Exportar CSV</button>
      <button id="btnClear" class="danger">🗑 Borrar índice</button>
    </div>
  </header>
  <div id="stats"></div>
  <div id="searchRow">
    <input id="search" type="text" placeholder="Buscar nicho, título o canal…" />
  </div>
  <div id="tableWrap"></div>
  <div id="foot"></div>
</div>
<script src="niche-index.js"></script>
</body>
</html>
